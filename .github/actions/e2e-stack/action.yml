name: e2e-stack
description: >-
  Prepares the full stack for end-to-end tests. Expects benefit-fe and benefit-be checked out as
  sibling folders of the workspace and the settings (APP_ENV, LLM_MODE, ...) in the job env.
inputs:
  browsers:
    description: Space-separated Playwright browsers to install
    default: chromium
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: benefit-fe/package.json
        cache: true
        cache_dependency_path: benefit-fe/pnpm-lock.yaml
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: benefit-fe/.nvmrc
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: benefit-be/uv.lock
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: benefit-be/.python-version

    - name: Install frontend dependencies
      shell: bash
      run: pnpm --dir benefit-fe install --frozen-lockfile

    - name: Read the pinned Temporal CLI version
      id: temporal
      shell: bash
      run: |
        version="$(sed -n 's/^TEMPORAL_CLI_VERSION := //p' benefit-be/Makefile)"
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Cache the Temporal CLI
      id: temporal-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/temporal
        key: temporal-cli-${{ steps.temporal.outputs.version }}-${{ runner.os }}-${{ runner.arch }}
    - name: Install the Temporal CLI
      if: steps.temporal-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.local/temporal"
        curl -fsSL "https://github.com/temporalio/cli/releases/download/v${{ steps.temporal.outputs.version }}/temporal_cli_${{ steps.temporal.outputs.version }}_linux_amd64.tar.gz" \
          | tar -xz -C "$HOME/.local/temporal" temporal
    - name: Put the Temporal CLI on PATH
      shell: bash
      run: |
        echo "$HOME/.local/temporal" >> "$GITHUB_PATH"
        "$HOME/.local/temporal/temporal" --version

    - name: Install MongoDB 8.0 from MongoDB's apt repository
      shell: bash
      run: |
        curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
          | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
        echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" \
          | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list > /dev/null
        sudo apt-get update
        sudo apt-get install -y mongodb-org

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('benefit-fe/pnpm-lock.yaml') }}-${{ inputs.browsers }}
    - name: Install Playwright browsers
      shell: bash
      working-directory: benefit-fe
      run: |
        if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
          pnpm exec playwright install-deps ${{ inputs.browsers }}
        else
          pnpm exec playwright install --with-deps ${{ inputs.browsers }}
        fi

    - name: Create the backend .env with a random demo password
      shell: bash
      working-directory: benefit-be
      run: |
        python3 scripts/make_env.py
        password="$(sed -n 's/^DEMO_PASSWORD=//p' .env)"
        echo "::add-mask::$password"
        echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
    - name: Install backend dependencies
      shell: bash
      working-directory: benefit-be
      run: uv sync --frozen
    - name: Start MongoDB and load the synthetic data
      shell: bash
      working-directory: benefit-be
      run: |
        make mongo-up
        make reset

    - name: Build the frontend
      shell: bash
      run: pnpm --dir benefit-fe build
    - name: Start the stack (Procfile.ci)
      shell: bash
      working-directory: benefit-be
      run: nohup uv run honcho -f Procfile.ci start > "$GITHUB_WORKSPACE/stack.log" 2>&1 &
    - name: Wait until the stack is ready
      shell: bash
      working-directory: benefit-fe
      run: bash scripts/ci/wait-ready.sh 120
