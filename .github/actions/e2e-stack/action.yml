name: e2e-stack
description: >-
  Prepares the full stack for end-to-end tests. Expects benefit-fe and benefit-be checked out as
  sibling folders of the workspace and the settings (APP_ENV, LLM_MODE, ...) in the job env.
inputs:
  browsers:
    description: Space-separated Playwright browsers to install
    default: chromium
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        package_json_file: benefit-fe/package.json
        cache: true
        cache_dependency_path: benefit-fe/pnpm-lock.yaml
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: benefit-fe/.nvmrc
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: benefit-be/uv.lock
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: benefit-be/.python-version

    - name: Install frontend dependencies
      shell: bash
      run: pnpm --dir benefit-fe install --frozen-lockfile

    - name: Read the pinned MongoDB and Temporal CLI versions
      id: versions
      shell: bash
      run: |
        temporal="$(sed -n 's/^TEMPORAL_CLI_VERSION := //p' benefit-be/Makefile)"
        # benefit-be pins MONGO_VERSION; a benefit-be ref from before it did gets the same default
        mongo="$(sed -n 's/^MONGO_VERSION := //p' benefit-be/Makefile)"
        test -n "$temporal"
        echo "temporal=$temporal" >> "$GITHUB_OUTPUT"
        echo "mongo=${mongo:-8.0.38}" >> "$GITHUB_OUTPUT"

    - name: Cache the Temporal CLI
      id: temporal-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/temporal
        key: temporal-cli-${{ steps.versions.outputs.temporal }}-${{ runner.os }}-${{ runner.arch }}
    - name: Install the Temporal CLI
      if: steps.temporal-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.versions.outputs.temporal }}
      run: |
        curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 -o "$RUNNER_TEMP/temporal.tgz" \
          "https://github.com/temporalio/cli/releases/download/v${VERSION}/temporal_cli_${VERSION}_linux_amd64.tar.gz"
        mkdir -p "$HOME/.local/temporal"
        tar -xzf "$RUNNER_TEMP/temporal.tgz" -C "$HOME/.local/temporal" temporal
    - name: Put the Temporal CLI on PATH
      shell: bash
      run: |
        echo "$HOME/.local/temporal" >> "$GITHUB_PATH"
        "$HOME/.local/temporal/temporal" --version

    # MongoDB: a cached tarball from MongoDB's own download server instead of apt, so a slow or
    # unreachable Ubuntu mirror can't stall setup.
    - name: Cache MongoDB
      id: mongo-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/mongodb
        key: mongodb-${{ steps.versions.outputs.mongo }}-ubuntu2404-${{ runner.arch }}
    - name: Download MongoDB
      if: steps.mongo-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ steps.versions.outputs.mongo }}
      run: |
        name="mongodb-linux-x86_64-ubuntu2404-${VERSION}"
        curl -fsSL --retry 5 --retry-all-errors --connect-timeout 20 \
          -o "$RUNNER_TEMP/mongodb.tgz" "https://fastdl.mongodb.org/linux/${name}.tgz"
        mkdir -p "$HOME/.local/mongodb"
        tar -xzf "$RUNNER_TEMP/mongodb.tgz" -C "$HOME/.local/mongodb" --strip-components=2 "${name}/bin/mongod"
    - name: Put MongoDB on PATH
      shell: bash
      run: |
        echo "$HOME/.local/mongodb" >> "$GITHUB_PATH"
        "$HOME/.local/mongodb/mongod" --version | head -1

    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('benefit-fe/pnpm-lock.yaml') }}-${{ inputs.browsers }}
    - name: Install Playwright browsers
      shell: bash
      working-directory: benefit-fe
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        # shellcheck disable=SC2086 # BROWSERS is a space-separated list
        pnpm exec playwright install $BROWSERS
        # Chromium's libraries are already on the ubuntu-24.04 image, so the PR's e2e job never runs apt.
        # Firefox and WebKit (the nightly) need more, from apt, told to retry and time out, not hang.
        if [ "$BROWSERS" != "chromium" ]; then
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' \
            | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          # shellcheck disable=SC2086
          timeout 600 pnpm exec playwright install-deps $BROWSERS
        fi

    - name: Create the backend .env with a random demo password
      shell: bash
      working-directory: benefit-be
      run: |
        python3 scripts/make_env.py
        password="$(sed -n 's/^DEMO_PASSWORD=//p' .env)"
        echo "::add-mask::$password"
        echo "E2E_PASSWORD=$password" >> "$GITHUB_ENV"
    - name: Install backend dependencies
      shell: bash
      working-directory: benefit-be
      run: uv sync --frozen
    - name: Start MongoDB and load the synthetic data
      shell: bash
      working-directory: benefit-be
      run: |
        make mongo-up
        make reset

    - name: Build the frontend
      shell: bash
      run: pnpm --dir benefit-fe build
    - name: Start the stack (Procfile.ci)
      shell: bash
      working-directory: benefit-be
      run: nohup uv run honcho -f Procfile.ci start > "$GITHUB_WORKSPACE/stack.log" 2>&1 &
    - name: Wait until the stack is ready
      shell: bash
      working-directory: benefit-fe
      run: bash scripts/ci/wait-ready.sh 120
