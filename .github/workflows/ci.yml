name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm audit --audit-level high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: The generated client is current for the vendored spec
        run: pnpm api:check
      - name: The vendored spec matches benefit-be at the sibling ref
        run: |
          ref="$(bash scripts/ci/resolve-sibling-ref.sh)"
          echo "Comparing openapi/openapi.json with benefit-be@$ref"
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY_OWNER}/benefit-be/refs/heads/${ref}/openapi/openapi.json" \
            -o "$RUNNER_TEMP/be-openapi.json"
          diff -u openapi/openapi.json "$RUNNER_TEMP/be-openapi.json" \
            || { echo "::error::openapi/openapi.json is out of date with benefit-be@$ref. Run pnpm api:gen."; exit 1; }

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_ENV: test
      LLM_MODE: fake
      EMBEDDER: fake
      RERANKER: fake
      TRACING_ENABLED: 'false'
      API_BASE_URL: http://localhost:8000
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: benefit-fe
          persist-credentials: false
      - name: Pick the benefit-be ref
        id: sibling
        run: echo "ref=$(bash benefit-fe/scripts/ci/resolve-sibling-ref.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/benefit-be
          ref: ${{ steps.sibling.outputs.ref }}
          path: benefit-be
          persist-credentials: false
      - uses: ./benefit-fe/.github/actions/e2e-stack
        with:
          browsers: chromium
      - name: Backend stack and API tests
        working-directory: benefit-be
        run: uv run pytest -m "stack or api"
      - name: Playwright (Chromium)
        working-directory: benefit-fe
        run: pnpm e2e
      - name: Upload the Playwright report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            benefit-fe/playwright-report/
            benefit-fe/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the stack log
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-log
          path: stack.log
          if-no-files-found: ignore
          retention-days: 7
